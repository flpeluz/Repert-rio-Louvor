<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Louvor e Adoração - VCD</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="Logo VCD.png" />
  <meta name="theme-color" content="#0b1120" />
  <link rel="apple-touch-icon" href="Logo VCD.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Louvor VCD" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-28 selection:bg-indigo-500 selection:text-white relative">
  <div class="max-w-md mx-auto px-4 pt-6">
    
    <!-- Cabeçalho -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-800/80">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-slate-900 border border-slate-700/60 flex items-center justify-center overflow-hidden shrink-0 shadow-inner">
          <img 
            src="Logo VCD.png" 
            alt="Logo Igreja" 
            class="w-full h-full object-contain p-1"
            onerror="this.onerror=null; this.parentElement.innerHTML='<i data-lucide=\'church\' class=\'w-5 h-5 text-indigo-400\'></i>'; lucide.createIcons();" 
          />
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-tight">Louvor e Adoração - VCD</h1>
          <p class="text-xs text-slate-400 font-medium">Escala e Repertório</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="alternarModoAdmin()" id="btn-lock" title="Acesso da Liderança" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center">
          <i data-lucide="lock" id="icon-lock" class="w-4 h-4 text-slate-400"></i>
        </button>
        <button onclick="carregarRepertorio(true)" title="Recarregar dados" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center">
          <i data-lucide="rotate-cw" id="icon-refresh" class="w-4 h-4 text-slate-300"></i>
        </button>
      </div>
    </header>

    <!-- Filtro de Mês -->
    <div class="mt-4 flex items-center justify-between bg-slate-900/90 border border-slate-800 p-2 rounded-xl">
      <span class="text-xs font-semibold text-slate-400 pl-2 flex items-center gap-1.5">
        <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-400"></i>
        Mês:
      </span>
      <select id="seletor-mes" onchange="mudarMes(this.value)" class="bg-slate-800 text-slate-200 text-xs font-semibold rounded-lg px-3 py-1.5 border border-slate-700 outline-none focus:border-indigo-500 transition">
      </select>
    </div>

    <!-- Barra de Filtros -->
    <div class="flex gap-2 overflow-x-auto py-3 no-scrollbar items-center" id="container-filtros">
      <button onclick="filtrarDia('PROXIMO')" data-filtro="PROXIMO" id="btn-filtro-proximo" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap transition flex items-center gap-1.5">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-200"></i>
        <span id="label-proximo">Próximo Culto</span>
      </button>
      <button onclick="filtrarDia('TODOS')" data-filtro="TODOS" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition">
        Todos
      </button>
      <button onclick="filtrarDia('Quinta')" data-filtro="Quinta" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition">
        Quintas
      </button>
      <button onclick="filtrarDia('Sábado')" data-filtro="Sábado" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition">
        Sábados
      </button>
      <button onclick="filtrarDia('Domingo')" data-filtro="Domingo" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition">

    <!-- Lista de Louvores -->

        <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2.5 text-indigo-400"></i>

      </div>
    </main>
  </div>

  <!-- Barra Flutuante de Ações (Admin) -->
  <div id="painel-botoes-admin" class="hidden fixed bottom-6 inset-x-0 mx-auto max-w-xs z-40 flex items-center justify-center gap-3">
    <button onclick="abrirModalMembros()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold py-3 px-3 rounded-2xl shadow-xl flex items-center justify-center gap-2 text-xs active:scale-95 transition">
      <i data-lucide="users" class="w-4 h-4 text-sky-400"></i>

    <button onclick="abrirModalNovoLouvor()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-3 rounded-2xl shadow-xl flex items-center justify-center gap-2 text-xs border border-indigo-400/30 active:scale-95 transition">

  <!-- Modal 1: Novo Louvor (Focado apenas na música) -->

    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl relative my-8">

          <i data-lucide="music-4" class="w-4 h-4 text-indigo-400"></i>
          Novo Louvor

        <button onclick="fecharModalLouvor()" class="text-slate-400 hover:text-white p-1">

          </div>

        <div class="grid grid-cols-2 gap-3">

            <label class="block text-slate-300 font-semibold mb-1">Ordem no Culto *</label>

            <select id="input-tom" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 outline-none focus:border-indigo-500">

                <option value="C#">C# / Db</option>
                <option value="D">D (Ré Maior)</option>
                <option value="Eb">Eb (Mi bemol)</option>
                <option value="E">E (Mi Maior)</option>
                <option value="F">F (Fá Maior)</option>
                <option value="F#">F# / Gb</option>
                <option value="G">G (Sol Maior)</option>
                <option value="Ab">Ab (Lá bemol)</option>
                <option value="A">A (Lá Maior)</option>
                <option value="Bb">Bb (Si bemol)</option>
                <option value="B">B (Si Maior)</option>
              </optgroup>
              <optgroup label="Tons Menores">
                <option value="Cm">Cm (Dó Menor)</option>
                <option value="C#m">C#m</option>
                <option value="Dm">Dm (Ré Menor)</option>
                <option value="Ebm">Ebm</option>
                <option value="Em">Em (Mi Menor)</option>
                <option value="Fm">Fm (Fá Menor)</option>
                <option value="F#m">F#m</option>
                <option value="Gm">Gm (Sol Menor)</option>
                <option value="Abm">Abm</option>
                <option value="Am">Am (Lá Menor)</option>
                <option value="Bbm">Bbm</option>

        <div class="space-y-2 pt-1 border-t border-slate-800">

        <div>

        </button>

      <!-- Louvores Escalados com Editar e Excluir -->

      </div>

          <i data-lucide="check" class="w-4 h-4"></i>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl relative my-8">

            <input type="number" id="edit-ordem" min="1" max="20" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-indigo-500" />

                <option value="Cm">Cm</option><option value="C#m">C#m</option><option value="Dm">Dm</option><option value="Ebm">Ebm</option><option value="Em">Em</option><option value="Fm">Fm</option><option value="F#m">F#m</option><option value="Gm">Gm</option><option value="Abm">Abm</option><option value="Am">Am</option><option value="Bbm">Bbm</option><option value="Bm">Bm</option>

      <div class="flex items-center justify-between pb-3 border-b border-slate-800">

          Membros do Louvor
        </h3>

      </form>

      <div class="mt-4 pt-3 border-t border-slate-800">
        <span class="text-xs font-semibold text-slate-400 block mb-2">Equipe Cadastrada:</span>
        <div id="lista-membros-cadastrados" class="space-y-1.5 max-h-56 overflow-y-auto pr-1"></div>
      </div>
    </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzkZZmDWoNs9MzMZch5sYRgrIR9oGlgQ2j6vU2PzlnN-d1hAJG8dyfOPwuZygQri9yv/exec";
    const CACHE_KEY = "repertorio_louvor_cache";
    const PIN_ACESSO = "1234";

    let todasMusicas = [];
    let todosMembros = [];
    let diaAtual = "PROXIMO";
    let mesAtual = "TODOS";
    let dataCultoAlvo = null;
    let dataCultoEmEdicao = null;
    let isAdmin = localStorage.getItem("louvor_admin_ativo") === "true";

    const NOMES_MESES = [
      "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
    ];

    function extrairYouTubeId(url) {
      if (!url) return null;
      const match = url.toString().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    function parseDataInfo(dataStr) {
      if (!dataStr) return { formatada: "", mesAno: "", chaveOrdenacao: 0, dateObj: null };
      const str = String(dataStr).trim();
      let d = 0, m = 0, a = 0;

      if (str.includes("/")) {
        const partes = str.split("/");
        d = parseInt(partes[0], 10);
        m = parseInt(partes[1], 10);
        a = parseInt(partes[2], 10);
      } else if (str.includes("-")) {
        const limpa = str.includes("T") ? str.split("T")[0] : str;
        const partes = limpa.split("-");
        a = parseInt(partes[0], 10);
        m = parseInt(partes[1], 10);
        d = parseInt(partes[2], 10);
      }

      if (!d || !m || !a) return { formatada: str, mesAno: "Outros", chaveOrdenacao: 0, dateObj: null };

      const dFormatado = String(d).padStart(2, '0');
      const mFormatado = String(m).padStart(2, '0');
      const nomeMes = NOMES_MESES[m - 1] || `Mês ${m}`;

      return {
        formatada: `${dFormatado}/${mFormatado}/${a}`,
        mesAno: `${nomeMes}/${a}`,
        chaveOrdenacao: (a * 10000) + (m * 100) + d,
        dateObj: new Date(a, m - 1, d)
      };
    }

    function obterCampo(obj, termos) {
      const normalizar = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
      const termosNorm = termos.map(normalizar);

      for (const chave in obj) {
        const chaveNorm = normalizar(chave);
        if (termosNorm.includes(chaveNorm) && obj[chave] !== "" && obj[chave] !== null && obj[chave] !== undefined) {
          return obj[chave];
        }
      }
      return "";
    }

    function alternarModoAdmin() {
      if (isAdmin) {
        if (confirm("Deseja sair do modo de liderança?")) {
          isAdmin = false;

    // Leitura, Filtros e Renderização
    function determinarCultoDestaque() {
      if (todasMusicas.length === 0) return null;

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);

      const datasMap = new Map();
      todasMusicas.forEach(m => {
        const info = parseDataInfo(obterCampo(m, ["data", "date"]));
        if (info.dateObj && !datasMap.has(info.chaveOrdenacao)) {
          datasMap.set(info.chaveOrdenacao, info);
        }
      });

      const datasOrdenadas = Array.from(datasMap.values()).sort((a, b) => a.chaveOrdenacao - b.chaveOrdenacao);
      if (datasOrdenadas.length === 0) return null;

      const proximoOuHoje = datasOrdenadas.find(item => item.dateObj >= hoje);
      let selecionado = proximoOuHoje ? proximoOuHoje : datasOrdenadas[datasOrdenadas.length - 1];
      const ehHoje = selecionado && selecionado.dateObj.getTime() === hoje.getTime();
      
      document.getElementById("label-proximo").innerText = ehHoje ? "Culto de Hoje" : "Próximo Culto";
      dataCultoAlvo = selecionado ? selecionado.formatada : null;

      if (selecionado && selecionado.mesAno) mesAtual = selecionado.mesAno;
      return selecionado;
    }

    function atualizarSeletorMeses() {
      const seletor = document.getElementById("seletor-mes");
      const mesesSet = new Set();

      todasMusicas.forEach(m => {
        const infoData = parseDataInfo(obterCampo(m, ["data", "date"]));
        if (infoData.mesAno && infoData.mesAno !== "Outros") mesesSet.add(infoData.mesAno);
      });

      const meses = Array.from(mesesSet);
      if (meses.length === 0) {
        seletor.innerHTML = `<option value="TODOS">Todos os Meses</option>`;
        return;
      }

      let options = `<option value="TODOS">Todos os Meses</option>`;
      meses.forEach(m => {
        options += `<option value="${m}" ${m === mesAtual ? "selected" : ""}>${m}</option>`;
      });

      seletor.innerHTML = options;
      seletor.value = mesAtual;
    }

    function mudarMes(novoMes) {
      mesAtual = novoMes;
      if (diaAtual === "PROXIMO") {
        diaAtual = "TODOS";
        atualizarBotoesFiltro();
      }
      renderizarCards();
    }

    function carregarDadosIniciais() {
      atualizarInterfaceAdmin();
      const dadosLocais = localStorage.getItem(CACHE_KEY);
      if (dadosLocais) {
        try {
          const parsed = JSON.parse(dadosLocais);
          if (Array.isArray(parsed)) {
            todasMusicas = parsed;
          } else {
            todasMusicas = parsed.repertorio || [];
            todosMembros = parsed.membros || [];
          }
          determinarCultoDestaque();
          atualizarSeletorMeses();
          atualizarBotoesFiltro();
          renderizarCards();
        } catch (e) {
          console.error("Erro ao ler cache:", e);
        }
      }
      carregarRepertorio(false);
    }

    async function carregarRepertorio(forcado = false) {
      const iconRefresh = document.getElementById("icon-refresh");
      if (iconRefresh) iconRefresh.classList.add("animate-spin");

      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const data = await res.json();
        
        let rep = [];
        let mem = [];

        if (Array.isArray(data)) {
          rep = data;
        } else if (data && data.repertorio) {
          rep = data.repertorio;
          mem = data.membros || [];
        }

        if (rep.length > 0 || mem.length > 0) {
          todasMusicas = rep;
          todosMembros = mem;
          localStorage.setItem(CACHE_KEY, JSON.stringify({ repertorio: rep, membros: mem }));
          determinarCultoDestaque();
          atualizarSeletorMeses();
          atualizarBotoesFiltro();
          renderizarCards();
        }
      } catch (err) {
        console.error("Erro na sincronização:", err);
      } finally {
        if (iconRefresh) iconRefresh.classList.remove("animate-spin");
        lucide.createIcons();
      }
    }

    function atualizarBotoesFiltro() {
      document.querySelectorAll(".filtro-btn").forEach((btn) => {
        const tipo = btn.getAttribute("data-filtro");
        if (tipo === diaAtual) {
          btn.className = "filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap transition flex items-center gap-1.5";
        } else {
          btn.className = "filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap transition flex items-center gap-1.5";
        }
      });
    }

    function filtrarDia(dia) {
      diaAtual = dia;
      atualizarBotoesFiltro();
      renderizarCards();
    }

    function renderizarCards() {
      const container = document.getElementById("lista-musicas");

      const filtradas = todasMusicas.filter(m => {
        const infoData = parseDataInfo(obterCampo(m, ["data", "date"]));
        const dia = obterCampo(m, ["dia", "diasemana", "dia_semana"]).toString().toLowerCase();

        if (diaAtual === "PROXIMO") return infoData.formatada === dataCultoAlvo;

        const bateMes = (mesAtual === "TODOS" || infoData.mesAno === mesAtual);
        const bateDia = (diaAtual === "TODOS" || dia.includes(diaAtual.toLowerCase()));
        return bateMes && bateDia;
      });

      if (filtradas.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 px-4 bg-slate-900/50 border border-dashed border-slate-800 rounded-2xl">
            <i data-lucide="calendar-x" class="w-8 h-8 text-slate-600 mx-auto mb-2"></i>
            <p class="text-slate-400 text-sm font-medium">Nenhum louvor encontrado</p>
            <p class="text-slate-600 text-xs mt-0.5">Sem cultos para o filtro selecionado.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const gruposPorData = {};
      filtradas.forEach(m => {
        const dataBruta = obterCampo(m, ["data", "date"]);
        const info = parseDataInfo(dataBruta);
        const diaSemana = obterCampo(m, ["dia", "diasemana", "dia_semana"]) || "Culto";
        const chaveGrupo = `${info.formatada} - ${diaSemana}`;

        if (!gruposPorData[chaveGrupo]) {
          gruposPorData[chaveGrupo] = {
            dataTexto: info.formatada,
            diaSemana: diaSemana,
            ordemData: info.chaveOrdenacao,
            integrantes: "",
            itens: []
          };
        }
        const integ = obterCampo(m, ["integrantes", "escala", "equipe"]);
        if (integ && !gruposPorData[chaveGrupo].integrantes) {
          gruposPorData[chaveGrupo].integrantes = integ;
        }
        gruposPorData[chaveGrupo].itens.push(m);
      });

      const gruposOrdenados = Object.values(gruposPorData).sort((a, b) => a.ordemData - b.ordemData);

      container.innerHTML = gruposOrdenados.map(grupo => {
        grupo.itens.sort((a, b) => {
          const ordA = parseInt(obterCampo(a, ["ordem", "order"]) || 99, 10);
          const ordB = parseInt(obterCampo(b, ["ordem", "order"]) || 99, 10);
          return ordA - ordB;
        });

        const cardsHtml = grupo.itens.map(m => {
          const titulo = obterCampo(m, ["titulo", "título", "titulo_final", "title"]) || "Louvor sem título";
          const tom = obterCampo(m, ["tom", "tonalidade"]) || "N/D";
          const ordem = obterCampo(m, ["ordem", "order"]) ? `#${obterCampo(m, ["ordem", "order"])}` : "";

          const linkYT = obterCampo(m, ["linkyoutube", "link_youtube", "youtube", "youtube_url_final"]);
          const linkCifra = obterCampo(m, ["linkcifra", "link_cifra", "cifra"]);
          const linkLetra = obterCampo(m, ["linkletra", "link_letra", "letra"]);
          const linkSpotify = obterCampo(m, ["linkspotify", "link_spotify", "spotify"]);

          const ytId = extrairYouTubeId(linkYT) || m.youtube_id;
          const thumb = ytId
            ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`
            : "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&q=80";

          return `
            <div class="bg-slate-900 border border-slate-800/90 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition">
              <div class="relative aspect-video w-full bg-slate-950">
                <img src="${thumb}" alt="${titulo}" class="w-full h-full object-cover opacity-90" loading="lazy" />
                
                ${linkYT ? `
                  <a href="${linkYT}" target="_blank" rel="noopener noreferrer" 
                     class="absolute inset-0 flex items-center justify-center bg-black/35 hover:bg-black/20 transition group">
                    <div class="w-12 h-12 rounded-full bg-red-600 text-white flex items-center justify-center shadow-lg transition transform group-hover:scale-110 active:scale-95">
                      <i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>
                    </div>
                  </a>
                ` : ''}

                <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
                  ${ordem ? `
                    <span class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 text-slate-200 px-2 py-0.5 rounded-md text-[11px] font-bold">
                      ${ordem}
                    </span>
                  ` : ''}
                </div>

                <div class="absolute top-2.5 right-2.5 bg-black/75 backdrop-blur-md border border-emerald-500/30 text-emerald-400 px-2.5 py-0.5 rounded-lg text-xs font-bold shadow">
                  Tom: ${tom}
                </div>
              </div>

              <div class="p-4">
                <h2 class="font-semibold text-slate-100 text-base leading-snug line-clamp-2">
                  ${titulo}
                </h2>

                <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-800/80">
                  ${linkCifra ? `
                    <a href="${linkCifra}" target="_blank" rel="noopener noreferrer" 
                       class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold active:scale-95 transition">
                      <i data-lucide="music" class="w-3.5 h-3.5 text-amber-400"></i>
                      <span>Cifra</span>
                    </a>
                  ` : `
                    <div class="flex items-center justify-center py-2.5 px-2 rounded-xl bg-slate-950/40 border border-slate-800/50 text-slate-600 text-xs font-medium">
                      Sem Cifra
                    </div>
                  `}

                  ${linkLetra ? `
                    <a href="${linkLetra}" target="_blank" rel="noopener noreferrer" 
                       class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold active:scale-95 transition">
                      <i data-lucide="file-text" class="w-3.5 h-3.5 text-sky-400"></i>
                      <span>Letra</span>
                    </a>
                  ` : `
                    <div class="flex items-center justify-center py-2.5 px-2 rounded-xl bg-slate-950/40 border border-slate-800/50 text-slate-600 text-xs font-medium">
                      Sem Letra
                    </div>
                  `}

                  ${linkSpotify ? `
                    <a href="${linkSpotify}" target="_blank" rel="noopener noreferrer" 
                       class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-slate-800/90 border border-emerald-500/30 hover:bg-emerald-950/30 text-emerald-300 text-xs font-semibold active:scale-95 transition">
                      <img src="Spotify.png" alt="Spotify" class="w-4 h-4 object-contain" />
                      <span class="text-white">Spotify</span>
                    </a>
                  ` : `
                    <div class="flex items-center justify-center py-2.5 px-2 rounded-xl bg-slate-950/40 border border-slate-800/50 text-slate-600 text-xs font-medium">
                      Sem Áudio
                    </div>
                  `}
                </div>
              </div>
            </div>
          `;
        }).join("");

        const botaoEditarCulto = isAdmin ? `
          <button onclick="abrirModalEditarCulto('${grupo.dataTexto}', '${grupo.diaSemana}')" class="text-[11px] font-bold text-amber-400 hover:text-amber-300 bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-lg flex items-center gap-1 transition active:scale-95">
            <i data-lucide="edit-3" class="w-3 h-3"></i>
            Editar Escala
          </button>
        ` : '';

        const escalaHtml = grupo.integrantes ? `
          <div class="bg-indigo-950/40 border border-indigo-500/30 rounded-2xl p-3.5 flex items-start gap-3 shadow-md">
            <div class="w-8 h-8 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center shrink-0 text-indigo-400">
              <i data-lucide="users" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <span class="text-[11px] font-bold text-indigo-300 uppercase tracking-wider block mb-1">Escala de Músicos</span>
              <p class="text-xs text-slate-200 leading-relaxed font-medium">${grupo.integrantes}</p>
            </div>
          </div>
        ` : '';

        return `
          <section class="space-y-3 pt-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-1">
                <div class="bg-indigo-950/70 border border-indigo-500/30 text-indigo-300 px-3.5 py-1 rounded-full text-xs font-bold tracking-wide uppercase shadow-sm">
                  ${grupo.diaSemana} • ${grupo.dataTexto}
                </div>
                <div class="h-px bg-slate-800 flex-1"></div>
              </div>
              ${botaoEditarCulto}
            </div>
            ${escalaHtml}
            <div class="space-y-4">
              ${cardsHtml}
            </div>
          </section>
        `;
      }).join("");

      lucide.createIcons();
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") carregarRepertorio(false);
    });

    setInterval(() => carregarRepertorio(false), 30000);

    carregarDadosIniciais();
  </script>
</body>
</html>
